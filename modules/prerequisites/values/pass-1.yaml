# Overlay of the first install pass, on top of the environment values.
# Helm validates every manifest against the cluster before creating
# anything, so a custom resource is installed one pass after the chart
# that defines its CRD. Pass 1 is the operators and controllers, and
# everything that needs no CRD.
tags:
  trust-manager: false
  cnpg-postgresql: false
  cert-issuers: false
  keycloak: false
