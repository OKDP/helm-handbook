# Overlay of the second install pass, on top of the environment values.
# Pass 2 adds trust-manager, whose webhook certificate is a cert-manager
# resource, and the database, a CloudNativePG resource. The issuers and
# trust bundle need the trust-manager CRDs, and identity needs the
# database: they come with the third pass, the environment values alone.
tags:
  cert-issuers: false
  keycloak: false
