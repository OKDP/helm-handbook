# Sandbox environment: a local Kind cluster, ingress suffix okdp.sandbox.
# Each prerequisite is switched on by its tag and configured in the block
# named after its alias. Values are the ones the OKDP sandbox runs, see
# sandbox-dependencies/packages/system/<name>.
tags:
  # tools
  reloader: false
  replicator: false
  secret-generator: false
  # cert-manager
  cert-manager: false
  # pg-operator
  cloudnative-pg: false
  # ingress
  ingress-nginx: false
  # external-secrets
  external-secrets: false
  # local-secrets-provider
  local-secrets-provider: true
  # dns, Kind only
  coredns-patch: false
  dns-server: false
  # cert-manager trust, second pass
  trust-manager: false
  # database-server, second pass
  cnpg-postgresql: false
  # cert-manager issuers, third pass
  cert-issuers: false
  # identity, third pass
  keycloak: false

# Pass 1: tools
reloader: {}
replicator: {}
secret-generator: {}

# Pass 1: cert-manager
cert-manager: {}

# Pass 1: pg-operator
cloudnative-pg: {}

# Pass 1: ingress
ingress-nginx: {}

# Pass 1: external-secrets
external-secrets: {}

# Pass 1: local-secrets-provider, from sandbox-dependencies/packages/system/local-secrets-provider
local-secrets-provider:
  # Sandbox credentials, in clear on purpose: this chart stands in for a
  # secret manager on a local cluster. Each entry is one Secret, replicated
  # to every namespace by the replicator of tools; an empty value is
  # generated at random by its secret generator.
  secrets:
    - name: creds-keycloak-db
      username: keycloak
      password: keycloak123

# Pass 1: dns, Kind only
coredns-patch: {}
dns-server: {}

# Pass 2: cert-manager trust
trust-manager: {}

# Pass 2: database-server
cnpg-postgresql: {}

# Pass 3: cert-manager issuers
cert-issuers: {}

# Pass 3: identity
keycloak: {}
