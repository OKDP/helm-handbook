# Sandbox environment: a local Kind cluster, ingress suffix okdp.sandbox.
# Each prerequisite is switched on by its tag and configured in the block
# named after its alias. Values are the ones the OKDP sandbox runs, see
# sandbox-dependencies/packages/system/<name>.
tags:
  # tools
  reloader: false
  replicator: false
  secret-generator: false
  # cert-manager
  cert-manager: true
  # pg-operator
  cloudnative-pg: false
  # ingress
  ingress-nginx: false
  # external-secrets
  external-secrets: false
  # local-secrets-provider
  local-secrets-provider: false
  # dns, Kind only
  coredns-patch: false
  dns-server: false
  # cert-manager trust, second pass
  trust-manager: true
  # database-server, second pass
  cnpg-postgresql: false
  # cert-manager issuers, third pass
  cert-issuers: true
  # identity, third pass
  keycloak: false

# Pass 1: tools
reloader: {}
replicator: {}
secret-generator: {}

# Pass 1: cert-manager, from sandbox-dependencies/packages/system/cert-manager
cert-manager:
  installCRDs: true
  enableCertificateOwnerRef: true
  image:
    repository: quay.io/jetstack/cert-manager-controller
  webhook:
    extraArgs:
      # 90 days of validity for the webhook serving certificate instead of 7.
      - --dynamic-serving-leaf-duration=2160h

# Pass 1: pg-operator
cloudnative-pg: {}

# Pass 1: ingress
ingress-nginx: {}

# Pass 1: external-secrets
external-secrets: {}

# Pass 1: local-secrets-provider
local-secrets-provider: {}

# Pass 1: dns, Kind only
coredns-patch: {}
dns-server: {}

# Pass 2: cert-manager trust, from sandbox-dependencies/packages/system/cert-manager
trust-manager:
  app:
    trust:
      # Where the CA Secret of the issuers lives: the release namespace.
      namespace: okdp-system
  secretTargets:
    enabled: true
    authorizedSecrets:
      - certs-bundle
  image:
    repository: quay.io/jetstack/trust-manager

# Pass 2: database-server
cnpg-postgresql: {}

# Pass 3: cert-manager issuers, from sandbox-dependencies/packages/system/cert-manager
cert-issuers:
  selfSignedClusterIssuers:
    - name: default-issuer
      certificate:
        commonName: OKDP Sandbox Self-Signed CA
        organization: OKDP
        country: FR
        validity: 8760h
        algorithm: ECDSA
        size: 256
  bundle:
    enabled: true
    name: certs-bundle
    target:
      configMap:
        enabled: true
        key: root-certs.pem
      secret:
        enabled: true
        key: ca.crt
      additionalFormats:
        pkcs12:
          enabled: true
          key: bundle.p12

# Pass 3: identity
keycloak: {}
