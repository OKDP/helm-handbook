# Sandbox environment: a local Kind cluster, ingress suffix okdp.sandbox.
# Each prerequisite is switched on by its tag and configured in the block
# named after its alias. Values are the ones the OKDP sandbox runs, see
# sandbox-dependencies/packages/system/<name>.
tags:
  # tools
  reloader: false
  replicator: false
  secret-generator: false
  # cert-manager
  cert-manager: false
  # pg-operator
  cloudnative-pg: false
  # ingress
  ingress-nginx: false
  # external-secrets
  external-secrets: false
  # local-secrets-provider
  local-secrets-provider: false
  # dns, Kind only
  coredns-patch: false
  dns-server: false
  # cert-manager trust, second pass
  trust-manager: false
  # database-server, second pass
  cnpg-postgresql: false
  # cert-manager issuers, third pass
  cert-issuers: false
  # identity, third pass
  keycloak: true

# Pass 1: tools
reloader: {}
replicator: {}
secret-generator: {}

# Pass 1: cert-manager
cert-manager: {}

# Pass 1: pg-operator
cloudnative-pg: {}

# Pass 1: ingress
ingress-nginx: {}

# Pass 1: external-secrets
external-secrets: {}

# Pass 1: local-secrets-provider
local-secrets-provider: {}

# Pass 1: dns, Kind only
coredns-patch: {}
dns-server: {}

# Pass 2: cert-manager trust
trust-manager: {}

# Pass 2: database-server
cnpg-postgresql: {}

# Pass 3: cert-manager issuers
cert-issuers: {}

# Pass 3: identity, from sandbox-dependencies/packages/system/keycloak
keycloak:
  global:
    security:
      # The images below are OKDP builds, not Bitnami ones.
      allowInsecureImages: true
  image:
    registry: quay.io
    repository: okdp/sandbox-images/keycloak
    tag: 26.1.3-debian-12-r0
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      cert-manager.io/cluster-issuer: default-issuer
    tls: true
    hostname: keycloak.okdp.sandbox
  auth:
    adminUser: admin
    adminPassword: admin
  postgresql:
    enabled: false
  externalDatabase:
    host: cnpg-postgresql-rw.okdp-system.svc.cluster.local
    port: "5432"
    database: keycloak
    # The credentials Secret of local-secrets-provider. Without it the chart
    # generates a password Secret of its own, and refuses to do so during a
    # helm upgrade, which is what the third pass is.
    existingSecret: creds-keycloak-db
    existingSecretUserKey: username
    existingSecretPasswordKey: password
  extraEnvVars:
    - name: KC_DB
      value: postgres
    - name: KC_DB_URL
      value: jdbc:postgresql://cnpg-postgresql-rw.okdp-system.svc.cluster.local:5432/keycloak
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: creds-keycloak-db
          key: username
    - name: KC_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: creds-keycloak-db
          key: password
    - name: KC_METRICS_ENABLED
      value: "false"
    - name: KC_TRACING_ENABLED
      value: "false"
    - name: KC_CACHE
      value: local
  production: false
  cache:
    enabled: false
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi
  keycloakConfigCli:
    enabled: true
    image:
      registry: quay.io
      repository: okdp/sandbox-images/keycloak-config-cli
      tag: 6.4.0-debian-12-r0
