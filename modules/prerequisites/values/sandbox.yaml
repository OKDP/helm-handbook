reloader:
  enabled: true
  reloader:
    deployment:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

replicator:
  enabled: true
  podSecurityContext:
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: ["ALL"]
  livenessProbe: { initialDelaySeconds: 10 }
  readinessProbe: { initialDelaySeconds: 10 }

secret-generator:
  enabled: true
  fullnameOverride: secret-generator
  podSecurityContext:
    fsGroup: 2000
    seccompProfile: { type: RuntimeDefault }
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: ["ALL"]

ingress-nginx:
  enabled: true
  controller:
    allowSnippetAnnotations: "false"
    extraArgs:
      enable-ssl-passthrough: "true"
    admissionWebhooks:
      enabled: true
    service:
      # To change type you just need to update here
      # type: LoadBlancer
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443
      # annotations:
      #   metallb.universe.tf/loadBalancerIPs: "192.168.1.50"

