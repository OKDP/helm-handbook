# Sandbox environment: a local Kind cluster, ingress suffix okdp.sandbox.
# Each prerequisite is switched on by its tag and configured in the block
# named after its alias. Values are the ones the OKDP sandbox runs, see
# sandbox-dependencies/packages/system/<name>.
tags:
  # tools
  reloader: false
  replicator: false
  secret-generator: false
  # cert-manager
  cert-manager: false
  # pg-operator
  cloudnative-pg: false
  # ingress
  ingress-nginx: true
  # external-secrets
  external-secrets: false
  # local-secrets-provider
  local-secrets-provider: false
  # dns, Kind only
  coredns-patch: false
  dns-server: false
  # cert-manager trust, second pass
  trust-manager: false
  # database-server, second pass
  cnpg-postgresql: false
  # cert-manager issuers, third pass
  cert-issuers: false
  # identity, third pass
  keycloak: false

# Pass 1: tools
reloader: {}
replicator: {}
secret-generator: {}

# Pass 1: cert-manager
cert-manager: {}

# Pass 1: pg-operator
cloudnative-pg: {}

# Pass 1: ingress, from sandbox-dependencies/packages/system/ingress-nginx
ingress-nginx:
  controller:
    allowSnippetAnnotations: false
    extraArgs:
      enable-ssl-passthrough: true
    admissionWebhooks:
      enabled: true
    # nodePort mode, the default of the sandbox: the Kind cluster maps these
    # ports to 80 and 443 on the host.
    service:
      type: NodePort
      nodePorts:
        http: 30080
        https: 30443
    # hostPort mode, replace the service block with:
    #   hostNetwork: true
    #   hostPort:
    #     enabled: true
    #   service:
    #     enabled: false
    # metallb mode, replace the service block with:
    #   service:
    #     annotations:
    #       metallb.universe.tf/loadBalancerIPs: <endpoint IP>
    #       metallb.universe.tf/allow-shared-ip: ingress

# Pass 1: external-secrets
external-secrets: {}

# Pass 1: local-secrets-provider
local-secrets-provider: {}

# Pass 1: dns, Kind only
coredns-patch: {}
dns-server: {}

# Pass 2: cert-manager trust
trust-manager: {}

# Pass 2: database-server
cnpg-postgresql: {}

# Pass 3: cert-manager issuers
cert-issuers: {}

# Pass 3: identity
keycloak: {}
