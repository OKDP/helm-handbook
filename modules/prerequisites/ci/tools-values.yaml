# chart-testing: installs the tools module alone.
tags:
  # tools
  reloader: true
  replicator: true
  secret-generator: true
  # cert-manager
  cert-manager: false
  # pg-operator
  cloudnative-pg: false
  # ingress
  ingress-nginx: false
  # external-secrets
  external-secrets: false
  # local-secrets-provider
  local-secrets-provider: false
  # dns, Kind only
  coredns-patch: false
  dns-server: false
  # cert-manager trust, second pass
  trust-manager: false
  # database-server, second pass
  cnpg-postgresql: false
  # cert-manager issuers, third pass
  cert-issuers: false
  # identity, third pass
  keycloak: false

# Pass 1: tools, from sandbox-dependencies/packages/system/tools
reloader:
  reloader:
    deployment:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        capabilities:
          drop:
            - ALL
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
replicator:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    capabilities:
      drop:
        - ALL
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
  livenessProbe:
    initialDelaySeconds: 10
  readinessProbe:
    initialDelaySeconds: 10
secret-generator:
  fullnameOverride: secret-generator
  podSecurityContext:
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
