# chart-testing: installs the dns module alone.
tags:
  # tools
  reloader: false
  replicator: false
  secret-generator: false
  # cert-manager
  cert-manager: false
  # pg-operator
  cloudnative-pg: false
  # ingress
  ingress-nginx: false
  # external-secrets
  external-secrets: false
  # local-secrets-provider
  local-secrets-provider: false
  # dns, Kind only
  coredns-patch: true
  dns-server: true
  # cert-manager trust, second pass
  trust-manager: false
  # database-server, second pass
  cnpg-postgresql: false
  # cert-manager issuers, third pass
  cert-issuers: false
  # identity, third pass
  keycloak: false

# Pass 1: dns, Kind only, from sandbox-dependencies/packages/system/coredns-patch and dns-server
coredns-patch:
  ingressSuffix: okdp.sandbox
  # The ingress controller Service of this chart, target of the CNAME.
  ingressService: prerequisites-ingress-nginx-controller.okdp-system.svc.cluster.local
  job:
    image: quay.io/okdp/sandbox-images/kubectl:latest
    restartPolicy: OnFailure
    nodeSelector:
      kubernetes.io/os: linux
dns-server:
  replicaCount: 1
  image:
    repository: 4km3/dnsmasq
    tag: 2.90-r3
    pullPolicy: IfNotPresent
  config:
    domain: okdp.sandbox
    target: 127.0.0.1
  service:
    type: NodePort
    port: 53
    nodePort: 30053
    protocol: UDP
  resources:
    requests:
      memory: 32Mi
      cpu: 50m
    limits:
      memory: 64Mi
      cpu: 100m
