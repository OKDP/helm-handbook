# chart-testing: installs the pg-operator module alone.
tags:
  # tools
  reloader: false
  replicator: false
  secret-generator: false
  # cert-manager
  cert-manager: false
  # pg-operator
  cloudnative-pg: true
  # ingress
  ingress-nginx: false
  # external-secrets
  external-secrets: false
  # local-secrets-provider
  local-secrets-provider: false
  # dns, Kind only
  coredns-patch: false
  dns-server: false
  # cert-manager trust, second pass
  trust-manager: false
  # database-server, second pass
  cnpg-postgresql: false
  # cert-manager issuers, third pass
  cert-issuers: false
  # identity, third pass
  keycloak: false

# Pass 1: pg-operator, from sandbox-dependencies/packages/system/cloudnative-pg
cloudnative-pg:
  config:
    # Watch Cluster resources in every namespace.
    clusterWide: true
  image:
    repository: ghcr.io/cloudnative-pg/cloudnative-pg
    pullPolicy: IfNotPresent
    tag: "1.29.1"
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      cpu: 1
      memory: 1Gi
