# Overlay: the hub database on the PostgreSQL server of the platform instead
# of sqlite on a volume. On top of values/minimal.yaml.
#
# Needs, on that server, a database named jupyterhub owned by a role named
# jupyterhub; how they are created belongs to the PostgreSQL module. The
# password below is the sandbox credential of that role; the chart stores it
# in the hub Secret. Replace the host, the database and the password with
# yours.

hub:
  db:
    type: postgres
    url: postgresql+psycopg2://jupyterhub@cnpg-postgresql-rw.okdp-system.svc.cluster.local:5432/jupyterhub
    password: jupyterhub123
