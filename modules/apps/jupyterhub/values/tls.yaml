# Overlay: HTTPS on the ingress, with a certificate issued by the cluster
# issuer of the platform. On top of values/minimal.yaml and values/ingress.yaml.

ingress:
  annotations:
    cert-manager.io/cluster-issuer: default-issuer
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  tls:
    - secretName: jupyterhub-tls
      hosts:
        - jupyterhub.okdp.sandbox
