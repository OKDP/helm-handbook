# Overlay: publish the hub through the ingress controller of the platform,
# under a host name, instead of a port-forward. On top of values/minimal.yaml.
# The cluster must resolve the host name to the ingress controller.

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - jupyterhub.okdp.sandbox
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
